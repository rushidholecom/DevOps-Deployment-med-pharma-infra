server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${AUTH_MONGODB_URI}
      database: ${AUTH_MONGODB_DATABASE}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.pharma.erp.auth: INFO

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

services:
  auth-service:
    base-url: ${AUTH_SERVICE_URL}
  employee-service:
    base-url: ${EMPLOYEE_SERVICE_URL}
  medicine-catalog-service:
    base-url: ${CATALOG_SERVICE_URL}
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL}
  procurement-service:
    base-url: ${PROCUREMENT_SERVICE_URL}
  sales-distribution-service:
    base-url: ${SALES_SERVICE_URL}
  production-batch-service:
    base-url: ${PRODUCTION_SERVICE_URL}
  quality-control-service:
    base-url: ${QUALITY_SERVICE_URL}
  warehouse-logistics-service:
    base-url: ${WAREHOUSE_SERVICE_URL}
  finance-billing-service:
    base-url: ${FINANCE_SERVICE_URL}